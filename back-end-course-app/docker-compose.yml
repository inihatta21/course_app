services:
  db:
    image: postgres:16.15-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=course_app
      - POSTGRES_PASSWORD=course_app
      - POSTGRES_DB=db_course_app
    ports:
      - "5434:5432"
    volumes:
      - pgdata_volume:/var/lib/postgresql/data
    networks:
      - app_network

volumes:
  pgdata_volume:

networks:
  app_network:
    driver: bridge
